<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='1754' viewBox='0 0 1240 1754'>
<defs><linearGradient id='blue' x1='0' x2='1'><stop stop-color='#061f62'/><stop offset='.55' stop-color='#086ff5'/><stop offset='1' stop-color='#063aaf'/></linearGradient><style>.q{font-family:Arial;font-size:24px;font-weight:700;fill:#073bb8}.opt{font-family:Arial;font-size:20px;fill:#083fba}.small{font-family:Arial;font-size:19px;fill:#063bb6}</style></defs>
<rect width='1240' height='1754' fill='white'/><path d='M0 0h260v360H0z' fill='url(#blue)'/><path d='M0 360h170l90-90v90H0z' fill='#061f62'/>
<text x='130' y='90' text-anchor='middle' fill='white' font-family='Arial' font-size='30' font-weight='700'>Unit</text><text x='130' y='190' text-anchor='middle' fill='#ffad00' font-family='Arial' font-size='90' font-weight='700'>2</text><text x='130' y='245' text-anchor='middle' fill='white' font-family='Arial' font-size='25' font-weight='700'>Cybersecurity</text>
<text x='290' y='78' fill='#164cdc' font-family='Arial' font-size='34' font-weight='700'>Lesson 2-1</text><rect x='290' y='92' width='240' height='8' fill='#f04b22'/><text x='290' y='160' fill='#0a0d54' font-family='Arial' font-size='47' font-weight='700'>HTTPS, TLS &amp; Secure Communication</text>
<text x='290' y='205' fill='#164cdc' font-family='Arial' font-size='26'>Multiple Choice Questions (MCQ)</text><rect x='30' y='245' width='1180' height='70' rx='30' fill='url(#blue)'/><circle cx='75' cy='280' r='30' fill='#082b77' stroke='#fff' stroke-width='3'/><text x='75' y='291' text-anchor='middle' fill='white' font-family='Arial' font-size='32' font-weight='700'>?</text><text x='125' y='292' fill='white' font-family='Arial' font-size='30' font-weight='700'>Choose the correct answer: a, b, c or d</text>
<circle cx='74' cy='390' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='399' text-anchor='middle' font-size='23' font-weight='700' fill='white'>1</text><text x='120' y='390' class='q'>1. What is the main purpose of HTTPS? </text><text x='130' y='434' class='opt'><tspan font-weight='700'>a)</tspan> Compress webpages</text><text x='385' y='434' class='opt'><tspan font-weight='700'>b)</tspan> Protect communication over the Internet</text><text x='640' y='434' class='opt'><tspan font-weight='700'>c)</tspan> Store passwords</text><text x='895' y='434' class='opt'><tspan font-weight='700'>d)</tspan> Increase Internet speed</text><circle cx='74' cy='495' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='504' text-anchor='middle' font-size='23' font-weight='700' fill='white'>2</text><text x='120' y='495' class='q'>2. HTTPS adds which security protocol to HTTP? </text><text x='130' y='539' class='opt'><tspan font-weight='700'>a)</tspan> FTP</text><text x='385' y='539' class='opt'><tspan font-weight='700'>b)</tspan> TLS</text><text x='640' y='539' class='opt'><tspan font-weight='700'>c)</tspan> DNS</text><text x='895' y='539' class='opt'><tspan font-weight='700'>d)</tspan> HTML</text><circle cx='74' cy='600' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='609' text-anchor='middle' font-size='23' font-weight='700' fill='white'>3</text><text x='120' y='600' class='q'>3. Which threat means secretly listening to data in transit? </text><text x='130' y='644' class='opt'><tspan font-weight='700'>a)</tspan> Eavesdropping</text><text x='385' y='644' class='opt'><tspan font-weight='700'>b)</tspan> Formatting</text><text x='640' y='644' class='opt'><tspan font-weight='700'>c)</tspan> Compression</text><text x='895' y='644' class='opt'><tspan font-weight='700'>d)</tspan> Duplication</text><circle cx='74' cy='705' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='714' text-anchor='middle' font-size='23' font-weight='700' fill='white'>4</text><text x='120' y='705' class='q'>4. What does TLS encryption do to transmitted data? </text><text x='130' y='749' class='opt'><tspan font-weight='700'>a)</tspan> Makes it unreadable to unauthorized parties</text><text x='385' y='749' class='opt'><tspan font-weight='700'>b)</tspan> Deletes it</text><text x='640' y='749' class='opt'><tspan font-weight='700'>c)</tspan> Makes it public</text><text x='895' y='749' class='opt'><tspan font-weight='700'>d)</tspan> Slows every server</text><circle cx='74' cy='810' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='819' text-anchor='middle' font-size='23' font-weight='700' fill='white'>5</text><text x='120' y='810' class='q'>5. What can TLS detect during transmission? </text><text x='130' y='854' class='opt'><tspan font-weight='700'>a)</tspan> A changed message</text><text x='385' y='854' class='opt'><tspan font-weight='700'>b)</tspan> A larger screen</text><text x='640' y='854' class='opt'><tspan font-weight='700'>c)</tspan> A new browser</text><text x='895' y='854' class='opt'><tspan font-weight='700'>d)</tspan> A stronger password</text><circle cx='74' cy='915' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='924' text-anchor='middle' font-size='23' font-weight='700' fill='white'>6</text><text x='120' y='915' class='q'>6. A digital certificate helps the browser verify the _____. </text><text x='130' y='959' class='opt'><tspan font-weight='700'>a)</tspan> Website identity</text><text x='385' y='959' class='opt'><tspan font-weight='700'>b)</tspan> File size</text><text x='640' y='959' class='opt'><tspan font-weight='700'>c)</tspan> Number of users</text><text x='895' y='959' class='opt'><tspan font-weight='700'>d)</tspan> Internet bill</text><circle cx='74' cy='1020' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1029' text-anchor='middle' font-size='23' font-weight='700' fill='white'>7</text><text x='120' y='1020' class='q'>7. In the TLS handshake, the server sends a certificate and a _____. </text><text x='130' y='1064' class='opt'><tspan font-weight='700'>a)</tspan> Public key</text><text x='385' y='1064' class='opt'><tspan font-weight='700'>b)</tspan> Password list</text><text x='640' y='1064' class='opt'><tspan font-weight='700'>c)</tspan> Common password</text><text x='895' y='1064' class='opt'><tspan font-weight='700'>d)</tspan> Fingerprint</text><circle cx='74' cy='1125' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1134' text-anchor='middle' font-size='23' font-weight='700' fill='white'>8</text><text x='120' y='1125' class='q'>8. Which attack pretends to be a legitimate website? </text><text x='130' y='1169' class='opt'><tspan font-weight='700'>a)</tspan> Impersonation</text><text x='385' y='1169' class='opt'><tspan font-weight='700'>b)</tspan> Backup</text><text x='640' y='1169' class='opt'><tspan font-weight='700'>c)</tspan> Rendering</text><text x='895' y='1169' class='opt'><tspan font-weight='700'>d)</tspan> Indexing</text><circle cx='74' cy='1230' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1239' text-anchor='middle' font-size='23' font-weight='700' fill='white'>9</text><text x='120' y='1230' class='q'>9. What is the result of a secure TLS handshake? </text><text x='130' y='1274' class='opt'><tspan font-weight='700'>a)</tspan> A secure connection is established</text><text x='385' y='1274' class='opt'><tspan font-weight='700'>b)</tspan> All data becomes public</text><text x='640' y='1274' class='opt'><tspan font-weight='700'>c)</tspan> The browser closes</text><text x='895' y='1274' class='opt'><tspan font-weight='700'>d)</tspan> The certificate is deleted</text><circle cx='74' cy='1335' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1344' text-anchor='middle' font-size='23' font-weight='700' fill='white'>10</text><text x='120' y='1335' class='q'>10. Which statement is correct? </text><text x='130' y='1379' class='opt'><tspan font-weight='700'>a)</tspan> HTTPS uses TLS to protect communication</text><text x='385' y='1379' class='opt'><tspan font-weight='700'>b)</tspan> HTTPS needs no keys</text><text x='640' y='1379' class='opt'><tspan font-weight='700'>c)</tspan> HTTPS sends readable data</text><text x='895' y='1379' class='opt'><tspan font-weight='700'>d)</tspan> HTTPS only changes page colors</text>
