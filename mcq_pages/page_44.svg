<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='1754' viewBox='0 0 1240 1754'>
<defs><linearGradient id='blue' x1='0' x2='1'><stop stop-color='#061f62'/><stop offset='.55' stop-color='#086ff5'/><stop offset='1' stop-color='#063aaf'/></linearGradient><style>.q{font-family:Arial;font-size:24px;font-weight:700;fill:#073bb8}.opt{font-family:Arial;font-size:20px;fill:#083fba}.small{font-family:Arial;font-size:19px;fill:#063bb6}</style></defs>
<rect width='1240' height='1754' fill='white'/><path d='M0 0h260v360H0z' fill='url(#blue)'/><path d='M0 360h170l90-90v90H0z' fill='#061f62'/>
<text x='130' y='90' text-anchor='middle' fill='white' font-family='Arial' font-size='30' font-weight='700'>Unit</text><text x='130' y='190' text-anchor='middle' fill='#ffad00' font-family='Arial' font-size='90' font-weight='700'>2</text><text x='130' y='245' text-anchor='middle' fill='white' font-family='Arial' font-size='25' font-weight='700'>Cybersecurity</text>
<text x='290' y='78' fill='#164cdc' font-family='Arial' font-size='34' font-weight='700'>Lesson 2-1</text><rect x='290' y='92' width='240' height='8' fill='#f04b22'/><text x='290' y='160' fill='#0a0d54' font-family='Arial' font-size='47' font-weight='700'>Authentication, MFA &amp; Combined Protection</text>
<text x='290' y='205' fill='#164cdc' font-family='Arial' font-size='26'>Multiple Choice Questions (MCQ)</text><rect x='30' y='245' width='1180' height='70' rx='30' fill='url(#blue)'/><circle cx='75' cy='280' r='30' fill='#082b77' stroke='#fff' stroke-width='3'/><text x='75' y='291' text-anchor='middle' fill='white' font-family='Arial' font-size='32' font-weight='700'>?</text><text x='125' y='292' fill='white' font-family='Arial' font-size='30' font-weight='700'>Choose the correct answer: a, b, c or d</text>
<circle cx='74' cy='390' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='399' text-anchor='middle' font-size='23' font-weight='700' fill='white'>21</text><text x='120' y='390' class='q'>21. Authentication is the process of _____. </text><text x='130' y='434' class='opt'><tspan font-weight='700'>a)</tspan> Checking identity before access</text><text x='385' y='434' class='opt'><tspan font-weight='700'>b)</tspan> Compressing files</text><text x='640' y='434' class='opt'><tspan font-weight='700'>c)</tspan> Designing a webpage</text><text x='895' y='434' class='opt'><tspan font-weight='700'>d)</tspan> Updating a keyboard</text><circle cx='74' cy='495' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='504' text-anchor='middle' font-size='23' font-weight='700' fill='white'>22</text><text x='120' y='495' class='q'>22. A password is an example of which factor? </text><text x='130' y='539' class='opt'><tspan font-weight='700'>a)</tspan> Knowledge</text><text x='385' y='539' class='opt'><tspan font-weight='700'>b)</tspan> Possession</text><text x='640' y='539' class='opt'><tspan font-weight='700'>c)</tspan> Biometric</text><text x='895' y='539' class='opt'><tspan font-weight='700'>d)</tspan> Location</text><circle cx='74' cy='600' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='609' text-anchor='middle' font-size='23' font-weight='700' fill='white'>23</text><text x='120' y='600' class='q'>23. A smartphone or smart card is a ____ factor. </text><text x='130' y='644' class='opt'><tspan font-weight='700'>a)</tspan> Possession</text><text x='385' y='644' class='opt'><tspan font-weight='700'>b)</tspan> Knowledge</text><text x='640' y='644' class='opt'><tspan font-weight='700'>c)</tspan> Biometric</text><text x='895' y='644' class='opt'><tspan font-weight='700'>d)</tspan> Network</text><circle cx='74' cy='705' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='714' text-anchor='middle' font-size='23' font-weight='700' fill='white'>24</text><text x='120' y='705' class='q'>24. A fingerprint is something you _____. </text><text x='130' y='749' class='opt'><tspan font-weight='700'>a)</tspan> Are</text><text x='385' y='749' class='opt'><tspan font-weight='700'>b)</tspan> Know</text><text x='640' y='749' class='opt'><tspan font-weight='700'>c)</tspan> Have</text><text x='895' y='749' class='opt'><tspan font-weight='700'>d)</tspan> Download</text><circle cx='74' cy='810' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='819' text-anchor='middle' font-size='23' font-weight='700' fill='white'>25</text><text x='120' y='810' class='q'>25. MFA means using _____. </text><text x='130' y='854' class='opt'><tspan font-weight='700'>a)</tspan> Multiple authentication factors</text><text x='385' y='854' class='opt'><tspan font-weight='700'>b)</tspan> One password twice</text><text x='640' y='854' class='opt'><tspan font-weight='700'>c)</tspan> Faster memory access</text><text x='895' y='854' class='opt'><tspan font-weight='700'>d)</tspan> A common key only</text><circle cx='74' cy='915' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='924' text-anchor='middle' font-size='23' font-weight='700' fill='white'>26</text><text x='120' y='915' class='q'>26. Which threat is best reduced by authentication and MFA? </text><text x='130' y='959' class='opt'><tspan font-weight='700'>a)</tspan> Unauthorized login</text><text x='385' y='959' class='opt'><tspan font-weight='700'>b)</tspan> Data compression</text><text x='640' y='959' class='opt'><tspan font-weight='700'>c)</tspan> Slow browsing</text><text x='895' y='959' class='opt'><tspan font-weight='700'>d)</tspan> File duplication</text><circle cx='74' cy='1020' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1029' text-anchor='middle' font-size='23' font-weight='700' fill='white'>27</text><text x='120' y='1020' class='q'>27. Which example uses biometric authentication? </text><text x='130' y='1064' class='opt'><tspan font-weight='700'>a)</tspan> Face recognition</text><text x='385' y='1064' class='opt'><tspan font-weight='700'>b)</tspan> Password</text><text x='640' y='1064' class='opt'><tspan font-weight='700'>c)</tspan> One-time code</text><text x='895' y='1064' class='opt'><tspan font-weight='700'>d)</tspan> Smart card</text><circle cx='74' cy='1125' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1134' text-anchor='middle' font-size='23' font-weight='700' fill='white'>28</text><text x='120' y='1125' class='q'>28. In online shopping, HTTPS, a certificate, MFA, and a signature provide _____. </text><text x='130' y='1169' class='opt'><tspan font-weight='700'>a)</tspan> Layered protection</text><text x='385' y='1169' class='opt'><tspan font-weight='700'>b)</tspan> One single defense</text><text x='640' y='1169' class='opt'><tspan font-weight='700'>c)</tspan> No verification</text><text x='895' y='1169' class='opt'><tspan font-weight='700'>d)</tspan> Public passwords</text><circle cx='74' cy='1230' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1239' text-anchor='middle' font-size='23' font-weight='700' fill='white'>29</text><text x='120' y='1230' class='q'>29. Why are several security technologies combined? </text><text x='130' y='1274' class='opt'><tspan font-weight='700'>a)</tspan> Each technology addresses a different risk</text><text x='385' y='1274' class='opt'><tspan font-weight='700'>b)</tspan> One tool is always enough</text><text x='640' y='1274' class='opt'><tspan font-weight='700'>c)</tspan> To remove encryption</text><text x='895' y='1274' class='opt'><tspan font-weight='700'>d)</tspan> To reduce user identity checks</text><circle cx='74' cy='1335' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1344' text-anchor='middle' font-size='23' font-weight='700' fill='white'>30</text><text x='120' y='1335' class='q'>30. The strongest summary of the lesson is: </text><text x='130' y='1379' class='opt'><tspan font-weight='700'>a)</tspan> Encryption, authentication, certificates, signatures and MFA work together</text><text x='385' y='1379' class='opt'><tspan font-weight='700'>b)</tspan> Only passwords matter</text><text x='640' y='1379' class='opt'><tspan font-weight='700'>c)</tspan> Public keys replace all security</text><text x='895' y='1379' class='opt'><tspan font-weight='700'>d)</tspan> HTTPS is only a visual feature</text>
<rect x='0' y='1680' width='1240' height='74' fill='#f6fbff'/><text x='42' y='1728' fill='#082b77' font-family='Arial' font-size='34' font-weight='700'>44</text><text x='530' y='1728' fill='#073bb6' font-family='Arial' font-size='28' font-weight='700'>Dr/Elmahdy</text><text x='945' y='1715' fill='#073bb6' font-family='Arial' font-size='18' font-style='italic'>Secure Today</text><text x='945' y='1738' fill='#073bb6' font-family='Arial' font-size='18' font-style='italic'>Brighter Tomorrow</text>
</svg>
