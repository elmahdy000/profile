<svg xmlns='http://www.w3.org/2000/svg' width='1240' height='1754' viewBox='0 0 1240 1754'>
<defs><linearGradient id='blue' x1='0' x2='1'><stop stop-color='#061f62'/><stop offset='.55' stop-color='#086ff5'/><stop offset='1' stop-color='#063aaf'/></linearGradient><style>.q{font-family:Arial;font-size:24px;font-weight:700;fill:#073bb8}.opt{font-family:Arial;font-size:20px;fill:#083fba}.small{font-family:Arial;font-size:19px;fill:#063bb6}</style></defs>
<rect width='1240' height='1754' fill='white'/><path d='M0 0h260v360H0z' fill='url(#blue)'/><path d='M0 360h170l90-90v90H0z' fill='#061f62'/>
<text x='130' y='90' text-anchor='middle' fill='white' font-family='Arial' font-size='30' font-weight='700'>Unit</text><text x='130' y='190' text-anchor='middle' fill='#ffad00' font-family='Arial' font-size='90' font-weight='700'>2</text><text x='130' y='245' text-anchor='middle' fill='white' font-family='Arial' font-size='25' font-weight='700'>Cybersecurity</text>
<text x='290' y='78' fill='#164cdc' font-family='Arial' font-size='34' font-weight='700'>Lesson 2-1</text><rect x='290' y='92' width='240' height='8' fill='#f04b22'/><text x='290' y='160' fill='#0a0d54' font-family='Arial' font-size='47' font-weight='700'>Public-Key, Common-Key &amp; Certificates</text>
<text x='290' y='205' fill='#164cdc' font-family='Arial' font-size='26'>Multiple Choice Questions (MCQ)</text><rect x='30' y='245' width='1180' height='70' rx='30' fill='url(#blue)'/><circle cx='75' cy='280' r='30' fill='#082b77' stroke='#fff' stroke-width='3'/><text x='75' y='291' text-anchor='middle' fill='white' font-family='Arial' font-size='32' font-weight='700'>?</text><text x='125' y='292' fill='white' font-family='Arial' font-size='30' font-weight='700'>Choose the correct answer: a, b, c or d</text>
<circle cx='74' cy='390' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='399' text-anchor='middle' font-size='23' font-weight='700' fill='white'>11</text><text x='120' y='390' class='q'>11. Public-key cryptography uses _____. </text><text x='130' y='434' class='opt'><tspan font-weight='700'>a)</tspan> One shared key only</text><text x='385' y='434' class='opt'><tspan font-weight='700'>b)</tspan> A public key and a private key</text><text x='640' y='434' class='opt'><tspan font-weight='700'>c)</tspan> No keys</text><text x='895' y='434' class='opt'><tspan font-weight='700'>d)</tspan> Three passwords</text><circle cx='74' cy='495' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='504' text-anchor='middle' font-size='23' font-weight='700' fill='white'>12</text><text x='120' y='495' class='q'>12. Which method is best for safely sharing a key? </text><text x='130' y='539' class='opt'><tspan font-weight='700'>a)</tspan> Public-key cryptography</text><text x='385' y='539' class='opt'><tspan font-weight='700'>b)</tspan> Common-key cryptography</text><text x='640' y='539' class='opt'><tspan font-weight='700'>c)</tspan> Plain text</text><text x='895' y='539' class='opt'><tspan font-weight='700'>d)</tspan> File compression</text><circle cx='74' cy='600' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='609' text-anchor='middle' font-size='23' font-weight='700' fill='white'>13</text><text x='120' y='600' class='q'>13. Which method is faster for encrypting large amounts of data? </text><text x='130' y='644' class='opt'><tspan font-weight='700'>a)</tspan> Public-key cryptography</text><text x='385' y='644' class='opt'><tspan font-weight='700'>b)</tspan> Common-key cryptography</text><text x='640' y='644' class='opt'><tspan font-weight='700'>c)</tspan> Certificate-only security</text><text x='895' y='644' class='opt'><tspan font-weight='700'>d)</tspan> Biometric security</text><circle cx='74' cy='705' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='714' text-anchor='middle' font-size='23' font-weight='700' fill='white'>14</text><text x='120' y='705' class='q'>14. During key exchange, the browser encrypts the common key using the serverâ€™s _____. </text><text x='130' y='749' class='opt'><tspan font-weight='700'>a)</tspan> Public key</text><text x='385' y='749' class='opt'><tspan font-weight='700'>b)</tspan> Private key</text><text x='640' y='749' class='opt'><tspan font-weight='700'>c)</tspan> Password</text><text x='895' y='749' class='opt'><tspan font-weight='700'>d)</tspan> Digital signature</text><circle cx='74' cy='810' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='819' text-anchor='middle' font-size='23' font-weight='700' fill='white'>15</text><text x='120' y='810' class='q'>15. Who can decrypt data encrypted with the serverâ€™s public key? </text><text x='130' y='854' class='opt'><tspan font-weight='700'>a)</tspan> The matching private key</text><text x='385' y='854' class='opt'><tspan font-weight='700'>b)</tspan> Any browser</text><text x='640' y='854' class='opt'><tspan font-weight='700'>c)</tspan> A third party</text><text x='895' y='854' class='opt'><tspan font-weight='700'>d)</tspan> The certificate name</text><circle cx='74' cy='915' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='924' text-anchor='middle' font-size='23' font-weight='700' fill='white'>16</text><text x='120' y='915' class='q'>16. A common key is used mainly to _____. </text><text x='130' y='959' class='opt'><tspan font-weight='700'>a)</tspan> Encrypt and decrypt data quickly</text><text x='385' y='959' class='opt'><tspan font-weight='700'>b)</tspan> Identify a person</text><text x='640' y='959' class='opt'><tspan font-weight='700'>c)</tspan> Sign a certificate</text><text x='895' y='959' class='opt'><tspan font-weight='700'>d)</tspan> Create a website</text><circle cx='74' cy='1020' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1029' text-anchor='middle' font-size='23' font-weight='700' fill='white'>17</text><text x='120' y='1020' class='q'>17. A digital signature can detect _____. </text><text x='130' y='1064' class='opt'><tspan font-weight='700'>a)</tspan> Tampering</text><text x='385' y='1064' class='opt'><tspan font-weight='700'>b)</tspan> Screen brightness</text><text x='640' y='1064' class='opt'><tspan font-weight='700'>c)</tspan> Network size</text><text x='895' y='1064' class='opt'><tspan font-weight='700'>d)</tspan> Browser history</text><circle cx='74' cy='1125' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1134' text-anchor='middle' font-size='23' font-weight='700' fill='white'>18</text><text x='120' y='1125' class='q'>18. Digital signatures also support _____. </text><text x='130' y='1169' class='opt'><tspan font-weight='700'>a)</tspan> Non-repudiation</text><text x='385' y='1169' class='opt'><tspan font-weight='700'>b)</tspan> Faster typing</text><text x='640' y='1169' class='opt'><tspan font-weight='700'>c)</tspan> More storage</text><text x='895' y='1169' class='opt'><tspan font-weight='700'>d)</tspan> Anonymous login</text><circle cx='74' cy='1230' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1239' text-anchor='middle' font-size='23' font-weight='700' fill='white'>19</text><text x='120' y='1230' class='q'>19. A trusted Certificate Authority signs a digital _____. </text><text x='130' y='1274' class='opt'><tspan font-weight='700'>a)</tspan> Certificate</text><text x='385' y='1274' class='opt'><tspan font-weight='700'>b)</tspan> Password</text><text x='640' y='1274' class='opt'><tspan font-weight='700'>c)</tspan> Browser</text><text x='895' y='1274' class='opt'><tspan font-weight='700'>d)</tspan> Shopping cart</text><circle cx='74' cy='1335' r='25' fill='#082b77' stroke='#ff9e00' stroke-width='3'/><text x='74' y='1344' text-anchor='middle' font-size='23' font-weight='700' fill='white'>20</text><text x='120' y='1335' class='q'>20. Why does HTTPS combine both key methods? </text><text x='130' y='1379' class='opt'><tspan font-weight='700'>a)</tspan> Safety for key sharing and speed for data</text><text x='385' y='1379' class='opt'><tspan font-weight='700'>b)</tspan> To remove authentication</text><text x='640' y='1379' class='opt'><tspan font-weight='700'>c)</tspan> To avoid encryption</text><text x='895' y='1379' class='opt'><tspan font-weight='700'>d)</tspan> To make pages colorful</text>
