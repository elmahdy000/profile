# ===== Complete /etc/nginx/sites-enabled/drelmahdy configuration =====

# www -> non-www (HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name www.drelmahdy.com;

    ssl_certificate /etc/letsencrypt/live/drelmahdy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drelmahdy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://drelmahdy.com$request_uri;
}

# http -> https non-www (both hosts, single hop)
server {
    listen 80;
    server_name drelmahdy.com www.drelmahdy.com;
    return 301 https://drelmahdy.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name drelmahdy.com;

    ssl_certificate /etc/letsencrypt/live/drelmahdy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drelmahdy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/profile/artifacts/dr-mahmoud/dist/public;
    index index.html;

    # Gzip & Performance Optimization for Max Speed & Google Core Web Vitals
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security & SEO headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML — no cache (always fresh)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Prerendered public pages (generated by `pnpm build`)
    location ~ ^/(baccalaureate|platform|university|curriculum)$ {
        root /var/www/profile/artifacts/dr-mahmoud/dist/public;
        try_files /$1/index.html =404;
        default_type text/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    location ~ ^/(baccalaureate|platform|university|curriculum)/$ {
        return 301 https://drelmahdy.com/$1;
    }

    # Old /kids link: redirect with real 301
    location = /kids {
        return 301 https://drelmahdy.com/platform?action=register;
    }

    # Real app routes -> SPA shell (200)
    location ~ ^/(platform/.*|admin(/.*)?|subadmin(/.*)?|parent|honor-board|leaderboard|self-assessment|booking|center-booking)$ {
        try_files /index.html =404;
    }

    # Hashed JS/CSS assets — cache 1 year (Vite generates unique hashes per build)
    location ~* \.(?:js|css|woff2|woff|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        access_log off;
    }

    # Images — cache 30 days
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Home + real files; anything else = real 404 (the app shows its NotFound page)
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Realtime student notifications (Server-Sent Events)
    location = /api/learning/notifications/stream {
        proxy_pass http://127.0.0.1:5000/api/learning/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # API proxy
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Large uploads are streamed to Node instead of being buffered to a
        # temporary nginx file first. This reduces disk I/O and upload latency.
        client_max_body_size 1G;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    # Uploads: serve public images directly via Nginx (fast, 30d immutable cache)
    location ^~ /uploads/ {
        location ~* ^/uploads/.*\.(?:png|jpg|jpeg|gif|webp|avif|svg|ico)$ {
            root /var/www/profile/artifacts/api-server/public;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
